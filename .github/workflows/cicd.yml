name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Backend Dockerfile
        id: backend_file
        run: |
          if [ -f "./backend/Dockerfile" ]; then
            echo "path=./backend/Dockerfile" >> $GITHUB_OUTPUT
          elif [ -f "./backend/dockerfile" ]; then
            echo "path=./backend/dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ${{ steps.backend_file.outputs.path }}
          push: true
          tags: |
            ghcr.io/ezaldeen200/app-backend:latest
            ghcr.io/ezaldeen200/app-backend:${{ github.sha }}
